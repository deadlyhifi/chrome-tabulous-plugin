<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabulous</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar__inner">
        <h1 class="toolbar__title">Tabulous</h1>
        <p class="toolbar__count" id="tab-count" aria-live="polite"></p>
        <button
          type="button"
          id="shortcut-settings"
          class="shortcut-button"
          popovertarget="shortcut-help"
          aria-label="Keyboard shortcut settings"
        >
          Shortcut
        </button>
        <dialog id="shortcut-help" class="shortcut-help" popover="auto">
          <strong id="shortcut-help__key">⌘⇧Y</strong>
          <span>Open Tabulous</span>
          <p>To change it, visit <code>chrome://extensions/shortcuts</code>.</p>
        </dialog>

        <button
          type="button"
          id="pin-view"
          class="icon-button"
          aria-label="Pin this Tabulous tab"
          aria-pressed="false"
          title="Pin this Tabulous tab"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M9.5.9a1.5 1.5 0 0 1 2.12 0l3.48 3.48a1.5 1.5 0 0 1 0 2.12l-.7.71a1.5 1.5 0 0 1-1.73.28l-1.9 1.9.2 2.46a1.5 1.5 0 0 1-2.55 1.18L5.8 10.9l-3.7 3.7a.75.75 0 1 1-1.06-1.06l3.7-3.7-2.13-2.13a1.5 1.5 0 0 1 1.18-2.55l2.46.2 1.9-1.9a1.5 1.5 0 0 1 .28-1.73z"
            />
          </svg>
        </button>

        <div class="search">
          <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M11.3 10.24a5.5 5.5 0 1 0-1.06 1.06l3.1 3.1a.75.75 0 1 0 1.06-1.06zM6.5 10.5a4 4 0 1 1 0-8 4 4 0 0 1 0 8"
            />
          </svg>
          <input
            type="search"
            id="filter"
            class="search__input"
            placeholder="Search tabs"
            aria-label="Search tabs by title or address"
            autocomplete="off"
          />
        </div>

        <label class="select">
          <span class="select__label">Sort</span>
          <select id="sort-key" aria-label="Sort tabs by">
            <option value="window">Window order</option>
            <option value="recent">Recently used</option>
            <option value="age">Time open</option>
            <option value="title">Title</option>
            <option value="domain">Website</option>
            <option value="group">Tab group</option>
            <option value="memory">Memory</option>
          </select>
        </label>

        <label class="select">
          <span class="select__label">Theme</span>
          <select id="theme" aria-label="Appearance">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>

      <div class="permission-bar" id="permission-bar" hidden>
        <p class="permission-bar__text" id="permission-text"></p>
        <button type="button" class="button button--accent" id="permission-grant">Enable</button>
        <button type="button" class="button" id="permission-dismiss">Not now</button>
      </div>
    </header>

    <main class="board" id="board" aria-label="Open tabs"></main>

    <p class="empty" id="empty" hidden>No tabs match your search.</p>

    <div class="bulk-bar" id="bulk-bar" hidden role="toolbar" aria-label="Selected tab actions">
      <span class="bulk-bar__count" id="bulk-count"></span>
      <button type="button" class="button" id="bulk-group">Group</button>
      <button type="button" class="button" id="bulk-new-window">Move to new window</button>
      <button type="button" class="button button--danger" id="bulk-close">Close</button>
      <button type="button" class="button" id="bulk-clear">Cancel</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
